*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1524;--pan:#132339;--pan2:#0f1d31;--line:rgba(255,255,255,.08);--tx:#e4ebf6;

.side{width:214px;flex:none;border-right:1px solid var(--line);padding:14px 11px;background:var(--pan2)}
.side h3{font-size:10px;letter-spacing:1.4px;color:var(--mut);text-transform:uppercase;margin:0 0 9px 6px}
.stp{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--tx);

.stp.rdy{opacity:1}.stp.on{background:var(--pan)}

.stp.on .num{background:var(--grn);color:#06131f;font-weight:700}

.kpi{margin-top:18px;padding:12px 10px;border-top:1px solid var(--line);font-size:12px}

.kpi b{color:var(--tx);font-size:15px}
.main{flex:1;padding:26px 32px;max-width:1220px}
h2{font-size:20px;margin-bottom:16px;font-weight:700}
.drops{display:flex;gap:18px;margin:8vh auto 0;max-width:760px}
.drop{flex:1;border:1.5px dashed rgba(255,255,255,.18);border-radius:12px;padding:34px 22px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover{border-color:var(--grn);background:rgba(51,204,136,.05)}
.drop.done{border-style:solid;border-color:var(--grn);background:rgba(51,204,136,.06);cursor:default}
.drop svg{width:30px;height:30px;stroke:var(--mut);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
.drop.done svg{stroke:var(--grn)}
.drop .t{font-weight:700;font-size:14px}.drop .s{font-size:12px;color:var(--mut);margin-top:4px}
.go{display:block;margin:26px auto 0;background:var(--grn);color:#06131f;border:0;padding:11px 30px;
border-radius:9px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.go[disabled]{opacity:.25;cursor:default}
.sec{background:var(--pan);border:1px solid var(--line);border-radius:11px;margin-bottom:14px;overflow:hidden}
.sec .hd{display:flex;align-items:center;gap:11px;padding:11px 15px;background:var(--pan2);border-bottom:1px solid var(--line)}
.sec .hd h4{font-size:13.5px;font-weight:650}
.sec .hd .t{margin-left:auto;font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:7px 14px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
td{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.d{font-size:11px;color:var(--mut);margin-top:2px}
.pill{display:inline-block;padding:2px 7px;border-radius:5px;font-size:9.5px;font-weight:700;letter-spacing:.5px}
.s-RFQ{background:var(--blub);color:var(--blu)}.s-ENGINEER{background:var(--purb);color:var(--pur)}
.s-RULE{background:var(--ambb);color:var(--amb)}.s-RATE{background:var(--ambb);color:var(--amb)}
.s-EXACT{background:var(--grnb);color:var(--grn)}.s-TAKE-OFF{background:var(--grnb);color:var(--grn)}.s-PRICE{background:var(--grnb);color:var(--grn)}.s-REF{background:rgba(255,255,255,.08);color:var(--mut)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut)}
.card{background:var(--pan);border:1px solid var(--line);border-radius:11px;padding:15px 17px;margin-bottom:12px}
.card h4{font-size:13px;margin-bottom:9px}
ul{margin-left:17px;font-size:12.5px}ul.tight li{margin-bottom:5px}li{margin-bottom:4px}
.flag{display:flex;gap:10px;padding:9px 13px;border-left:2px solid var(--amb);background:rgba(242,179,78,.06);margin-bottom:7px;font-size:12.5px;border-radius:0 7px 7px 0}
.flag.red{border-color:var(--red);background:rgba(255,106,106,.06)}.flag.ok{border-color:var(--grn);background:rgba(51,204,136,.06)}
.flag .w{margin-left:auto;color:var(--mut);font-size:11.5px;text-align:right;flex:none}
.pane{display:none}.pane.on{display:block}
.btn{background:var(--grn);color:#06131f;border:0;padding:9px 20px;border-radius:8px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;margin-top:16px}
details{margin-top:8px}summary{cursor:pointer;font-size:12px;color:var(--grn)}

<script>
const $=s=>document.querySelector(s);
let loaded={spec:false,pid:false,notes:false}, built=false, step=1;
const STEPS=[["Specification","what the client asked"],["Design input","preliminary P&ID"],
 ["Workbook","the costing sheet"],["RFQs","suppliers & contractors"],["Electrical","maximum demand"],
 ["Checks","completeness"],["Tender schedule","the client's numbering"]];
const money=n=>(n<0?"−":"")+"$"+Math.round(Math.abs(n)).toLocaleString("en-NZ");

function sidebar(){
  $("#steps").innerHTML=STEPS.map((s,i)=>
    `<button class="stp ${(i<2||built)?'rdy':''} ${step===i+1?'on':''}" onclick="go(${i+1})">
      <span class=num>${i+1}</span><div><b>${s[0]}</b><span>${s[1]}</span></div></button>`).join("");
  $("#jobhdr").innerHTML = built?`<b>${D.job}</b>${D.ref}`:"";
  const n=D.lines.length, rfq=D.lines.filter(l=>l.src==="RFQ").length,
        eng=D.lines.filter(l=>l.src==="ENGINEER").length,
        rule=D.lines.filter(l=>l.src.startsWith("RULE")||l.src.startsWith("RATE")).length;
  $("#kpi").innerHTML = built?`
    <div class=row>Lines<b>${n}</b></div>
    <div class=row>Awaiting RFQ<b>${rfq}</b></div>
    <div class=row>Engineer to enter<b>${eng}</b></div>
    <div class=row>Rules to confirm<b>${rule}</b></div>`:"";
}
function dropBox(k,title,sub){
  const name = loaded[k] ? (dropped[k] || (k==="spec"?D.spec_file:k==="pid"?D.pid_file:"meeting notes")) : title;
  const icon = (k==="spec"||k==="notes")
    ? '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>'
    : '<path d="M3 3h18v18H3z"/><path d="M3 9h18M9 3v18"/>';
  return `<div class="drop ${loaded[k]?'done':''}" data-k="${k}" onclick="pick('${k}')"
      ondragover="dOver(event)" ondragleave="dOut(event)" ondrop="dDrop(event,'${k}')"
      style="max-width:420px">
      <svg viewBox="0 0 24 24">${icon}</svg>
      <div class=t>${name}</div><div class=s>${loaded[k]?"loaded":sub}</div></div>`;
}
function drops(){
  $("#main").innerHTML=`<div class=drops>
    <div class="drop ${loaded.spec?'done':''}" data-k="spec" onclick="pick('spec')"
       ondragover="dOver(event)" ondragleave="dOut(event)" ondrop="dDrop(event,'spec')">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>
      <div class=t>${loaded.spec?(dropped.spec||D.spec_file):"Specification"}</div>
      <div class=s>${loaded.spec?"loaded":"PDF"}</div></div>
    <div class="drop ${loaded.pid?'done':''}" data-k="pid" onclick="pick('pid')"
       ondragover="dOver(event)" ondragleave="dOut(event)" ondrop="dDrop(event,'pid')">
      <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 3v18"/></svg>
      <div class=t>${loaded.pid?(dropped.pid||D.pid_file):"Preliminary P&ID"}</div>
      <div class=s>${loaded.pid?"loaded":"PDF"}</div></div></div>
    <button class=go id=gobtn ${loaded.spec&&loaded.pid?"":"disabled"} onclick="buildIt()">Build the workbook</button>
    <div style="text-align:center;margin-top:22px;font-size:12px;color:var(--mut)">
      <a href="${D.files.spec}" download style="color:var(--grn)">specification</a>
      &nbsp;·&nbsp;
      <a href="${D.files.pidf}" download style="color:var(--grn)">preliminary P&ID</a>
    </div>`;
}
const dropped={};
function dOver(e){e.preventDefault();e.currentTarget.style.borderColor="var(--grn)";
  e.currentTarget.style.background="rgba(51,204,136,.10)";}
function dOut(e){e.currentTarget.style.borderColor="";e.currentTarget.style.background="";}
function dDrop(e,k){e.preventDefault();
  const f=e.dataTransfer.files[0]; if(f) dropped[k]=f.name;
  if(k==="notes") k="spec"; loaded[k]=true; render();}
function pick(k){ if(k==="notes") k="spec"; loaded[k]=true; render(); }
function buildIt(){ built=true; go(3); }
function go(n){ if(n>2 && !built) return; step=n; sidebar(); render(); }

function lineRow(l){
  const src=l.src.replace("?","");
  const q=l.qty==null?"<span style='color:var(--mut)'>—</span>":l.qty;
  const p=l.price==null?"<span style='color:var(--mut)'>—</span>":money(l.price);
  return `<tr><td><b>${l.desc}</b>${l.note?`<div class=d>${l.note}</div>`:""}
    ${l.ref?`<div class=d style="color:var(--grn)">${l.ref}</div>`:""}</td>
    <td class=code>${l.code}</td><td><span class="pill s-${src}">${src}</span></td>
    <td class=r>${q}<div class=d>${l.unit}</div></td><td class=r>${p}</td>
    <td class=d>${l.why}</td></tr>`;
}

  const m=$("#main");

          <a href="${D.files.spec}" download style="color:var(--grn)">example specification</a></div>`;
      return; }
    const g=D.dig;
    const list=(t,a,f)=>a&&a.length?`<div class=card><h4>${t}</h4><ul class=tight>${a.map(f).join("")}</ul></div>`:"";
    m.innerHTML=`<h2>Specification</h2>
    <div style="display:flex;gap:10px;align-items:center;margin:0 0 16px">
      <a class=btn style="display:inline-block;text-decoration:none;margin:0"
         href="${D.files.brief}" download>Download the specification summary</a>
      <button class=btn style="margin:0;background:none;border:1px solid var(--line);color:var(--tx)"
         onclick="go(2)">Next: design input →</button></div>
    <div class=card><h4>${g.title}</h4><div class=d>${g.project}</div></div>
    ${list("Scope", g.scope, x=>`<li>${x}</li>`)}
    ${g.criteria.length?`<div class=card><h4>Design criteria</h4><table>${
      g.criteria.map(c=>`<tr><td style="width:44%">${c[0]}</td><td><b>${c[1]}</b></td></tr>`).join("")}</table></div>`:""}

    ${g.decisions.length?`<div class=card><h4>Engineer must decide</h4>${
      g.decisions.map(d=>`<div class="flag"><div>${d[1]}</div><div class=w>${d[0]}</div></div>`).join("")}</div>`:""}
    ${list("Required with the tender", g.tender_requires, x=>`<li>${x}</li>`)}
    <div class=card><h4>Schedule of prices</h4><ul class=tight>${
      D.secs.map(s=>`<li><b>${s[0]}</b> ${s[1]}</li>`).join("")}</ul></div>`; return; }
  if(step===2){
    if(!loaded.pid){
      m.innerHTML=`<h2>Design input</h2>${dropBox("pid","Preliminary P&ID","PDF")}
        <div style="margin-top:18px;font-size:12px;color:var(--mut)">
          <a href="${D.files.pidf}" download style="color:var(--grn)">example preliminary P&ID</a></div>`;
      return; }
    const p=D.pid, eq=D.equipment;
    const nComp=Object.values(p.connections).reduce((a,b)=>a+b,0);
    const nPipe=Object.values(p.pipe).reduce((a,b)=>a+b,0);
    m.innerHTML=`<h2>Design input</h2>
      <button class=btn style="margin:0 0 16px" onclick="buildIt()">Build the workbook</button>
      <div class=sec><div class=hd><h4>Equipment on the drawing</h4>
        <div class=t>${eq.length} loads</div></div>
        <table><thead><tr><th>Load</th><th class=r>Duty</th><th>Starter</th></tr></thead><tbody>
        ${eq.map(e=>`<tr><td><b>${e.name}</b></td><td class=r>${e.kw} ${e.unit}</td>
          <td>${e.starter?e.starter:'<span class="pill s-ENGINEER">not shown</span>'}</td></tr>`).join("")}
        </tbody></table></div>
      <div class=card><div class=d>${nComp} valve connections and ${nPipe} pipe runs also read off the drawing —
        they appear in the workbook take-off.</div></div>`;
    return; }
  if(step===3){
    let h=`<h2>Workbook</h2><a class=btn style="display:inline-block;text-decoration:none;margin:0 0 16px"
      href="${D.files.workbook}" download>Download the costing workbook</a>`;
    for(const [ref,title] of D.secs.map(s=>[s[0],s[1]])){
      const ls=D.lines.filter(l=>l.sec===ref); if(!ls.length) continue;
      h+=`<div class=sec><div class=hd><span class="pill s-EXACT">${ref}</span><h4>${title}</h4>
        <div class=t>${ls.length} lines</div></div>
        <table><thead><tr><th>Description</th><th>Code</th><th>Source</th><th class=r>Qty</th><th class=r>Unit price</th><th>Status</th></tr></thead>
        <tbody>${ls.map(lineRow).join("")}</tbody></table></div>`;
    }
    m.innerHTML=h; return; }
  if(step===4){
    const groups=D.rfq_groups.map(([t,who,re])=>[t,who,l=>new RegExp(re).test(l.code)&&l.src!=="PRICE LIST"]);

We are pricing the above and would appreciate your quotation for:

${ls.map(l=>`  ${String(l.qty??"__").padStart(4)} ${l.unit.padEnd(4)} ${l.desc}`).join("\n")}

Please include lead time and validity.

CoolLogic Refrigeration Ltd</div></details></div>`;}).join(""); return; }

    const RULE={"EC Fan Supply":[0,0,0,0,0,1,0],"VSD":[0,0,0,0,0,1,0],"IE5 VSD":[0,0,0,0,0,1,0],

    const anc=n=>{for(const [re,l] of ANC) if(re.test(n)) return l; return [];};
    let tot=[0,0,0,0,0,0,0], kw=0, rows="";

      const io=RULE[e.starter]; kw+=e.kw;

      rows+=`<tr><td><b>${e.name}</b></td><td class=r>${e.kw}<div class=d>${e.unit}</div></td>
        <td>${e.starter?e.starter:'<span class="pill s-ENGINEER">ENGINEER</span>'}</td>`+
        (io?io.map(v=>`<td class=r>${v||"·"}</td>`).join(""):"<td class=r style='color:var(--mut)'>??</td>".repeat(7))+
        `</tr>`;
      anc(e.name).forEach(a=>{rows+=`<tr><td style="padding-left:30px;color:var(--mut)">${a}</td>
        <td></td><td></td>${"<td></td>".repeat(7)}</tr>`;});
    });
    m.innerHTML=`<h2>Electrical</h2><div class=sec>
      <div class=hd><h4>Maximum demand schedule</h4><div class=t>${D.equipment.length} loads · ${kw.toLocaleString()} kW connected</div></div>
      <table><thead><tr><th>Load</th><th class=r>Duty</th><th>Starter</th><th class=r>DI</th><th class=r>DO</th>
      <th class=r>AI</th><th class=r>RTD</th><th class=r>AO</th><th class=r>Comms</th><th class=r>IFM</th></tr></thead>
      <tbody>${rows}<tr style="border-top:2px solid var(--line)"><td><b>Total</b></td><td class=r><b>${kw.toLocaleString()}</b></td><td></td>
      ${tot.map(v=>`<td class=r><b>${v||"·"}</b></td>`).join("")}</tr></tbody></table></div>`; return; }
  if(step===6){
    m.innerHTML=`<h2>Checks</h2>`+D.checks.map(c=>{
      const cls=c[0]==="status"?"flag ok":c[0]==="family"?"flag red":"flag";
      return `<div class="${cls}"><div><b>${c[1]}</b></div><div class=w>${c[2]}</div></div>`;}).join(""); return; }
  if(step===7){
    let tc=0, ts=0, unpriced=0;
    const rows=D.secs.map(s=>{
      const ls=D.lines.filter(l=>l.sec===s[0]);
      const c=ls.reduce((a,l)=>a+((typeof l.qty==="number"&&typeof l.price==="number")?l.qty*l.price:0),0);
      unpriced+=ls.filter(l=>!(typeof l.qty==="number"&&typeof l.price==="number")).length;
      const sell=c/(1-0.15); tc+=c; ts+=sell;
      return `<tr><td>${s[0]}</td><td>${s[1]}</td><td class=r>${c?money(c):'<span style="color:var(--mut)">—</span>'}</td>
        <td class=r>${c?`<b>${money(sell)}</b>`:'<span style="color:var(--mut)">—</span>'}</td></tr>`;}).join("");
    m.innerHTML=`<h2>Tender schedule</h2><div class=sec><table><thead><tr><th>Ref</th>
      <th>Description</th><th class=r>Cost</th><th class=r>Sell</th></tr></thead><tbody>${rows}
      <tr style="border-top:2px solid var(--line)"><td></td><td><b>Priced so far (excl GST)</b></td><td class=r><b>${money(tc)}</b></td><td class=r><b>${money(ts)}</b></td></tr>
      <tr><td></td><td style="color:var(--mut)">Lines still awaiting a price or an engineer's number</td><td class=r style="color:var(--mut)">${unpriced}</td><td></td></tr>
      </tbody></table></div>`; return; }
}
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>e.preventDefault());
sidebar(); render();
</script></body></html>
