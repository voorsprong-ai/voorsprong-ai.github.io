<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>CoolLogic — Margin Tracker</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1524;--panel:#132339;--panel2:#0f1d31;--line:rgba(255,255,255,.08);--tx:#e4ebf6;--mut:#8194b3;--grn:#33cc88;--grnb:rgba(51,204,136,.14);--red:#ff6a6a;--redb:rgba(255,106,106,.14);--amb:#f2b34e}
body{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.5;min-height:100vh}
.bar{display:flex;align-items:center;gap:14px;padding:20px 32px;border-bottom:1px solid var(--line);background:var(--panel2)}
.bar .wm{font-size:22px;font-weight:800;letter-spacing:-.4px}.bar .wm .g{color:var(--grn)}
.bar .tl{font-size:13px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;font-weight:600;margin-top:2px}
.shell{display:flex;min-height:calc(100vh - 55px)}
/* sidebar */
.side{width:288px;flex:none;border-right:1px solid var(--line);padding:18px 14px;background:var(--panel2)}
.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin:4px 8px 12px}
.job{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:12px 14px;cursor:pointer;margin-bottom:8px;color:var(--tx);transition:.12s;display:block}
.job:hover{background:rgba(255,255,255,.03)}
.job.on{background:var(--panel);border-color:var(--line)}
.job .jn{font-size:14px;font-weight:600}
.job .jc{font-size:12px;color:var(--mut);margin-top:1px}
.job .jr{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.job .jv{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.dot.o{background:var(--redb);color:var(--red)}.dot.u{background:var(--grnb);color:var(--grn)}.dot.t{background:rgba(129,148,179,.15);color:var(--mut)}
.jbar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden}
.jbar i{display:block;height:100%;background:var(--mut)}
/* main */
.main{flex:1;padding:26px 34px 70px;max-width:940px}
.jhead{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.jhead h1{font-size:24px;letter-spacing:-.3px}.jhead .sc{color:var(--mut);font-size:13px;margin-top:3px}
.jhead .val{text-align:right}.jhead .val .n{font-size:22px;font-weight:800}.jhead .val .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.imp{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0}
.ibtn{background:var(--grn);color:#04160c;border:0;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.ibtn:hover{filter:brightness(1.08)}
.imeta{font-size:12.5px;color:var(--mut)}.imeta b{color:var(--tx)}
/* progress */
.prog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.prog .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:8px}
.ptrack{height:12px;border-radius:7px;background:rgba(255,255,255,.07);position:relative;overflow:visible}
.pfill{height:12px;border-radius:7px;background:linear-gradient(90deg,#2ba24f,#33cc88)}
.pnow{position:absolute;top:-6px;width:2px;height:24px;background:#fff;border-radius:2px}
.pnow span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10.5px;color:#fff;background:#000a;padding:1px 6px;border-radius:5px;white-space:nowrap}
.pdates{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:12px}
/* hero */
.hero{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.h{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.h .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.h .l{font-size:11.5px;color:var(--mut);margin-top:2px}
.h.over .n{color:var(--red)}.h.under .n{color:var(--grn)}
/* warn */
.warn{border-radius:12px;padding:14px 18px;margin-bottom:18px;font-size:14px;line-height:1.55}
.warn.o{background:var(--redb);border:1px solid rgba(255,106,106,.3);color:#ffd3d3}
.warn.u{background:var(--grnb);border:1px solid rgba(51,204,136,.3);color:#c9f5e2}
.warn b{color:#fff}
/* table */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;padding:9px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
td.r{text-align:right}.gname{font-weight:600;color:var(--tx)}
.trk{position:relative;height:12px;background:rgba(255,255,255,.06);border-radius:6px;min-width:120px}
.trk .tk{position:absolute;left:50%;top:-2px;width:2px;height:16px;background:rgba(255,255,255,.2)}
.trk .fv{position:absolute;top:0;height:12px;border-radius:6px}
.vpill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.vpill.o{background:var(--redb);color:var(--red)}.vpill.u{background:var(--grnb);color:var(--grn)}
tr.totr td{font-weight:800;border-top:2px solid rgba(255,255,255,.15);font-size:15px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f1d31;border:1px solid var(--line);color:#fff;padding:13px 20px;border-radius:10px;font-size:13.5px;max-width:560px;text-align:center;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.shell{flex-direction:column}.side{width:100%}}
</style></head><body>
<div class="bar">
<svg viewBox="0 0 34 34" width="24" height="24"><g stroke="#33cc88" stroke-width="2.4" stroke-linecap="round"><line x1="17" y1="4" x2="17" y2="30"/><line x1="6" y1="10.5" x2="28" y2="23.5"/><line x1="6" y1="23.5" x2="28" y2="10.5"/><line x1="17" y1="8" x2="13.5" y2="5"/><line x1="17" y1="8" x2="20.5" y2="5"/><line x1="17" y1="26" x2="13.5" y2="29"/><line x1="17" y1="26" x2="20.5" y2="29"/></g></svg>
<div><div class="wm">Cool<span class="g">Logic</span></div><div class="tl">Margin Tracker</div></div>
</div>
<div class="shell">
  <div class="side"><h3>Live jobs</h3><div id="jobs"></div></div>
  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>
<script>
var JOBS=[
 {id:"103667",name:"Coolstore 45",client:"Trevelyan's Pack & Cool",value:3513020,start:"1 Oct 2025",end:"15 Apr 2026",pct:62,updated:"17 Feb 2026",
  groups:[
   {n:"Electrical subcontract",b:1375721,a:1384555},
   {n:"Capital equipment",b:871869,a:929463},
   {n:"Welding & insulation subcontract",b:294660,a:419189},
   {n:"Labour — in-house",b:256775,a:225861},
   {n:"Materials",b:142096,a:163280},
   {n:"Refrigerant & consumables",b:66517,a:41203},
   {n:"Prelims & general",b:35950,a:55818},
   {n:"Commissioning",b:8000,a:0},
   {n:"Instrumentation",b:3212,a:0}
  ]},
 {id:"103688",name:"Blast freezer upgrade",client:"Southern Cold",value:2760000,start:"5 Aug 2025",end:"20 Mar 2026",pct:78,updated:"14 Feb 2026",
  groups:[
   {n:"Refrigeration plant",b:940000,a:1012000},
   {n:"Electrical & controls",b:610000,a:598000},
   {n:"Pipework & fabrication",b:410000,a:441000},
   {n:"Insulation & panels",b:220000,a:214000},
   {n:"Design, PM & commissioning",b:220000,a:207000}
  ]},
 {id:"103702",name:"Packhouse chiller",client:"Bay Produce",value:2070000,start:"2 Dec 2025",end:"30 Jun 2026",pct:38,updated:"16 Feb 2026",
  groups:[
   {n:"Capital equipment",b:680000,a:672000},
   {n:"Electrical & controls",b:520000,a:511000},
   {n:"Pipework & fabrication",b:340000,a:333000},
   {n:"Materials",b:180000,a:176000},
   {n:"Design, PM & commissioning",b:180000,a:170000}
  ]},
 {id:"103694",name:"Cold store refit",client:"Fern Logistics",value:1380000,start:"1 Jul 2025",end:"28 Feb 2026",pct:90,updated:"15 Feb 2026",
  groups:[
   {n:"Refrigeration plant",b:420000,a:409000},
   {n:"Electrical & controls",b:300000,a:305000},
   {n:"Pipework & fabrication",b:250000,a:243000},
   {n:"Insulation",b:130000,a:126000},
   {n:"Design, PM & commissioning",b:100000,a:94000}
  ]},
 {id:"103715",name:"Glycol plant expansion",client:"Highfield Coolstores",value:1127000,start:"20 Jan 2026",end:"14 Aug 2026",pct:22,updated:"16 Feb 2026",
  groups:[
   {n:"Capital equipment",b:380000,a:372000},
   {n:"Pipework & fabrication",b:250000,a:246000},
   {n:"Electrical & controls",b:200000,a:198000},
   {n:"Materials",b:110000,a:107000},
   {n:"Design, PM & commissioning",b:40000,a:37000}
  ]}
];
var sel=0;
function m(n){return '$'+Math.round(n).toLocaleString('en-NZ');}
function ms(n){var a=Math.abs(n);return (n<0?'−':'+')+'$'+Math.round(a).toLocaleString('en-NZ');}
function totals(j){var b=0,a=0;j.groups.forEach(function(g){b+=g.b;a+=g.a;});return {b:b,a:a,v:b-a};}
function renderJobs(){
 var h='';JOBS.forEach(function(j,i){
  var t=totals(j),over=t.v<0;
  var d=over?'<span class="dot o">'+ms(t.v)+'</span>':'<span class="dot u">'+ms(t.v)+'</span>';
  h+='<button class="job'+(i==sel?' on':'')+'" onclick="pick('+i+')">'+
     '<div class="jn">'+j.name+'</div><div class="jc">'+j.id+' · '+j.client+'</div>'+
     '<div class="jr"><span class="jv">'+m(t.a)+' / '+m(t.b)+'</span>'+d+'</div>'+
     '<div class="jbar"><i style="width:'+j.pct+'%"></i></div></button>';
 });
 document.getElementById('jobs').innerHTML=h;
}
function pick(i){sel=i;renderJobs();renderMain();window.scrollTo(0,0);}
function renderMain(){
 var j=JOBS[sel],t=totals(j),over=t.v<0;
 // biggest over group
 var worst=null;j.groups.forEach(function(g){var v=g.b-g.a;if(v<0&&(!worst||v<worst.v))worst={n:g.n,v:v};});
 var scale=0;j.groups.forEach(function(g){scale=Math.max(scale,Math.abs(g.b-g.a));});
 var rows='';j.groups.forEach(function(g){
  var v=g.b-g.a,go=v<0,w=scale?Math.min(48,Math.abs(v)/scale*48):0;
  var bar='<div class="trk"><div class="tk"></div><div class="fv" style="'+(go?'left:50%;background:var(--red)':'right:50%;background:var(--grn)')+';width:'+w+'%"></div></div>';
  rows+='<tr><td class="gname">'+g.n+'</td><td class="r" style="color:var(--mut)">'+m(g.b)+'</td><td class="r">'+m(g.a)+'</td>'+
        '<td class="r" style="color:'+(go?'var(--red)':'var(--grn)')+';font-weight:700">'+ms(v)+'</td>'+
        '<td>'+bar+'</td><td><span class="vpill '+(go?'o':'u')+'">'+(go?'Over':'Under')+'</span></td></tr>';
 });
 var warn=over
  ? '<div class="warn o">⚠ <b>'+ms(t.v)+'</b> over budget at <b>'+j.pct+'% complete</b> — biggest miss <b>'+worst.n+' '+ms(worst.v)+'</b>, committed and flagged <b>before month-end</b>, while there\'s still time to act.</div>'
  : '<div class="warn u">✓ Running <b>'+ms(t.v)+'</b> under budget at <b>'+j.pct+'% complete</b> — no lines committed over.</div>';
 var nowLeft=Math.max(4,Math.min(96,j.pct));
 document.getElementById('main').innerHTML=
  '<div class="jhead"><div><h1>'+j.name+'</h1><div class="sc">'+j.id+' · '+j.client+'</div></div>'+
   '<div class="val"><div class="n">'+m(j.value)+'</div><div class="l">Contract value (incl GST)</div></div></div>'+
  '<div class="imp"><button class="ibtn" onclick="imp()">&#8593;&nbsp; Import Accredo export</button>'+
   '<span class="imeta">Last updated <b id="upd">'+j.updated+'</b> · drop in this month\'s Job Invoice Review to refresh the actuals</span></div>'+
  '<div class="prog"><div class="lab"><span>Project progress</span><span>'+j.pct+'% complete</span></div>'+
   '<div class="ptrack"><div class="pfill" style="width:'+j.pct+'%"></div><div class="pnow" style="left:'+nowLeft+'%"><span>now</span></div></div>'+
   '<div class="pdates"><span>'+j.start+'</span><span>'+j.end+'</span></div></div>'+
  '<div class="hero">'+
   '<div class="h"><div class="n">'+m(t.b)+'</div><div class="l">Budget</div></div>'+
   '<div class="h"><div class="n">'+m(t.a)+'</div><div class="l">Committed / actual to date</div></div>'+
   '<div class="h '+(over?'over':'under')+'"><div class="n">'+ms(t.v)+'</div><div class="l">'+(over?((t.v/t.b*-100).toFixed(1)+'% over'):((t.v/t.b*100).toFixed(1)+'% under'))+'</div></div>'+
  '</div>'+warn+
  '<table><thead><tr><th>Cost group</th><th class="r">Budget</th><th class="r">Committed</th><th class="r">Variance</th><th>Under · Over</th><th></th></tr></thead><tbody>'+rows+
   '<tr class="totr"><td>Job total</td><td class="r" style="color:var(--mut)">'+m(t.b)+'</td><td class="r">'+m(t.a)+'</td><td class="r" style="color:'+(over?'var(--red)':'var(--grn)')+'">'+ms(t.v)+'</td><td></td><td></td></tr>'+
  '</tbody></table>';
}
function imp(){
 var t=document.getElementById('toast');
 t.textContent='Imported Job Invoice Review — 1,523 lines auto-matched to budget on C&T code · 3 flagged to review';
 t.className='toast show';var u=document.getElementById('upd');if(u)u.textContent='17 Feb 2026';
 setTimeout(function(){t.className='toast';},4200);
}
renderJobs();renderMain();
</script>
</body></html>
